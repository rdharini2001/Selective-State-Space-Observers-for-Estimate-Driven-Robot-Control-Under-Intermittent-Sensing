[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-observer-evaluation"
version = "0.2.0"
description = "Closed-loop evaluation and real-data stress testing of learned robot state observers"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
